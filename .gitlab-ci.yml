stages:
  - build
  - pylint
  - test
  - deploy

services:
  - name: docker:20.10.9-dind
    alias: thedockerhost

variables:
  DOCKER_HOST: tcp://thedockerhost:2375/
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

build:
  stage: build
  script:
    - echo "Beginning of build stage"
    - docker-compose build 
    - docker-compose up -d
    - echo "End of build stage"
  only:
    - project

pylint:
  stage: pylint
  image: python:3.8
  script:
    - echo "Beginning of pylint stage"
    - pip install pylint requests unittest
    - pylint --fail-under=8 ./tests/*.py
    - echo "End of pylint stage"
  only:
    - project

test:
  stage: test
  script:
    - echo "Beginning of test stage"
    - docker-compose ps
    - docker-compose run test || exit 1
  after_script:
    - docker-compose down
    - echo "End of test stage"
  only:
    - project

deploy:
  stage: deploy
  script:
    - echo "Beginning of deploy stage"
    - docker-compose up -d
    - docker-compose ps
    - echo "End of deploy stage"
  only:
    - project