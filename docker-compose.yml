services:
  service1:
    build: ./service1
    expose:
      - "8199:8199"
    deploy:
      replicas: 3
    depends_on:
      - service2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-network

  service2:
    build: ./service2
    expose:
      - "8200:8200"
    networks:
      - app-network

  nginx:
    build: ./nginx
    ports:
      - "8198:8198"
      - "8197:8197"
    depends_on:
      - service1
      - service2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8197"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - app-network

  test:
    build: ./tests
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge