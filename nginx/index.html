<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Request Interface</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { margin: 50px; text-align: center; display: grid; gap: 5px; }
        textarea { height: 400px; margin-top: 20px; }
        button { height: 50px; }
    </style>
</head>
<body>
    <div class="container">
        <textarea id="responseArea" placeholder="Response will appear here..." readonly></textarea>
        <button onclick="makeRequest()" style="background-color: lightblue;">REQUEST</button>
    </div>

    <div class="container">
        <h2>System Control</h2>
        <button id="initButton" onclick="changeState('INIT')">INIT</button>
        <button id="runningButton" onclick="changeState('RUNNING')" disabled>RUNNING</button>
        <button id="pausedButton" onclick="changeState('PAUSED')" disabled>PAUSED</button>
        <button id="shutdownButton" onclick="changeState('SHUTDOWN')" disabled>SHUTDOWN</button>
    </div>

    <div class="container">
        <h2>System Status</h2>
        <button id="getStateButton" onclick="getState()">Get Current State</button>
        <button id="getLogButton" onclick="getLog()">Get Run Log</button>
        <textarea id="stateLogArea" readonly></textarea>
    </div>

    <script src="index.js"></script>
</body>
</html>
